# Reference nginx config for freelanceaiconsultant.com
# Static site built by Astro (output: 'static', trailingSlash: 'never'), served from
# /var/www/freelanceaiconsultant/live -- a symlink the deploy flow in DEPLOY.md repoints to the
# latest verified release, so a failed build never changes what this path resolves to. Apply
# manually on the VPS, e.g. as /etc/nginx/sites-available/freelanceaiconsultant.com, then `ln -s`
# it into sites-enabled.
#
# This file assumes SSL is not set up yet. Run certbot after enabling this config; the
# "certbot will add" comments below mark where it inserts `listen 443 ssl;` and the
# ssl_certificate/ssl_certificate_key/options-ssl-nginx.conf/ssl_dhparam lines, per server block.

# www -> apex (non-www is canonical)
server {
    listen 80;
    listen [::]:80;
    server_name www.freelanceaiconsultant.com;

    # certbot will add here: listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    # include /etc/letsencrypt/options-ssl-nginx.conf; ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://freelanceaiconsultant.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name freelanceaiconsultant.com;

    # certbot will add here: listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    # include /etc/letsencrypt/options-ssl-nginx.conf; ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/freelanceaiconsultant/live;
    index index.html;

    # Security headers + default (short) cache lifetime, site-wide. Repeated (not inherited) inside
    # the /_astro/ block below, because nginx's add_header only inherits into a location that does
    # not itself declare add_header; a location with its own add_header drops every inherited one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "public, max-age=300" always;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/xml text/xml image/svg+xml;

    # trailingSlash: 'never' -- redirect /path/ to /path (but leave "/" itself alone).
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }

    # Hashed, fingerprinted build assets: long cache, never revalidated.
    location ^~ /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /sitemap-en.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /nl/sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    # Astro's build only flat-files the top-level 404.astro to /404.html; nl/404.astro is a normal
    # route and builds to /nl/404/index.html. These two internal targets serve each one with the
    # original 404 status preserved (error_page without "=" keeps the error code).
    location = /404.html {
        internal;
    }

    location = /nl/404/index.html {
        internal;
    }

    location /nl/ {
        error_page 404 /nl/404/index.html;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
