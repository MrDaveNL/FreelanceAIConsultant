# Sveltia CMS configuratie voor freelanceaiconsultant.com.
#
# Scope: markdown-content onder src/content/pages/{en,nl}. Geen dienstenpagina's, cases,
# inzichten, RAG-blokken, data-bestanden, routes, componenten, layouts of schema/JSON-LD. Zie
# docs/cms.md voor de redenen; voor home/over/werkwijze (geen markdown, maar hardcoded
# .astro-pagina's + src/data/*.js) zie docs/cms.md en planning/migratieplan-kernpaginas-cms.md.
#
# Geen Sveltia-i18n (geen top-level "i18n:"-blok): EN en NL zijn losse collecties per taal. De
# "id"-waarde in de front matter koppelt een EN- en NL-pagina inhoudelijk, maar is voor het CMS
# puur informatief, Sveltia schrijft er niets in terug. Reden: de url/mapnaam per taal is niet
# hetzelfde (bijv. "ai-examples" vs "ai-voorbeelden"), terwijl Sveltia's i18n-structuren
# (multiple_files/multiple_folders) een identieke slug per taal verwachten.
#
# Twee soorten collecties:
# - kennisbank_en/kennisbank_nl: create en delete staan AAN. Een nieuwe of verwijderde pagina
#   werkt zonder handwerk in routes.ts: src/data/routes.ts leidt de kennisbank-routes (sitemap,
#   hreflang, taalwisselaar) automatisch af uit de front matter van deze bestanden, en de build
#   faalt met een duidelijke melding (src/pages/[...slug].astro) als een contentpagina toch geen
#   'live' route heeft. 'identifier_field: navLabel' zorgt dat de mapnaam van een nieuwe pagina
#   op het korte navigatielabel wordt gebaseerd, niet op de lange titel.
# - overige_pagina_en/overige_pagina_nl: alle andere markdown-pagina's onder src/content/pages
#   (de 12 clusters, elk een hoofdpagina + eventuele subpagina's), als "files"-collecties: een
#   vaste lijst van bestaande bestanden, zodat er hier GEEN create/delete-knop kan verschijnen.
#   Nieuwe pagina's in deze clusters (nieuw id, interne links, RAG-afstemming) blijven via
#   Claude Code lopen, met de volledige verificatie.
#
# Beide typen delen hetzelfde front-matter-schema (content.config.ts); de velden staan daarom
# maar twee keer voluit (pagesFieldsEn/pagesFieldsNl, als YAML-anchor), één keer per taal, en
# worden door elke collectie in die taal hergebruikt.

backend:
  name: github
  repo: MrDaveNL/FreelanceAIConsultant
  branch: cms

# Niet gebruikt: geen afbeelding staat in content-bestanden (zie fase 1, punt 7). Verplicht veld
# voor Sveltia, vandaar een map die in de praktijk leeg blijft.
media_folder: "public/admin/uploads"
public_folder: "/admin/uploads"

collections:
  - name: kennisbank_en
    label: "Knowledge base (EN)"
    folder: src/content/pages/en/kennisbank
    path: "{{slug}}/index"
    identifier_field: navLabel
    format: frontmatter
    extension: md
    create: true
    delete: true
    fields: &pagesFieldsEn
      - label: "ID"
        name: id
        widget: string
        pattern: ["^[A-Za-z0-9-]+$", "Alleen letters, cijfers en -"]
        hint: >-
          Koppelt de EN- en NL-versie van deze pagina; moet uniek zijn op de hele site.
          Voorbeeld: C10-06, of een nieuw P-nummer voor een hoofdpagina. Controleer de IDs van de
          andere pagina's in deze lijst (en de NL-lijst) voordat je kiest, om een dubbele ID te
          voorkomen.
      - { label: Taal, name: lang, widget: hidden, default: en }
      - label: URL
        name: url
        widget: string
        pattern: ["^/", "Moet beginnen met /"]
        hint: "Bijvoorbeeld /knowledge-base/my-new-page. Moet overeenkomen met de mapnaam van dit bestand."
      - label: "Parent ID"
        name: parent
        widget: string
        required: false
        hint: >-
          ID van de bovenliggende pagina (bijv. C3-05), of leeg laten voor een hoofdpagina
          (hub). Dit is een vrij tekstveld, geen dropdown: 'parent' kan ook naar een pagina
          buiten de kennisbank verwijzen.
      - label: Cluster
        name: cluster
        widget: select
        options:
          - "1. AI Consulting & Advice"
          - "2. AI Implementation"
          - "3. AI Automation"
          - "4. AI for business"
          - "5. AI Development"
          - "6. AI Agents"
          - "7. AI markets"
          - "8. AI policy & governance"
          - "9. AI workshops & training"
          - "10. Knowledge base AI tools"
          - "Core pages"
        default: "10. Knowledge base AI tools"
        hint: "Welke sectie van de site. Voor een nieuwe kennisbankpagina meestal '10. Knowledge base AI tools'."
      - label: "Page type"
        name: pageType
        widget: select
        options: [Hub, Spoke, Sector, "Knowledge base", "Knowledge base hub", "Conversion / pricing", "Trust / partner network"]
        default: "Knowledge base"
        hint: "Meestal 'Knowledge base' voor een gewone kennisbankpagina."
      - label: Schema
        name: schema
        widget: select
        options: [service, article, collection, pricing]
        default: article
        hint: "'article' voor een gewone kennisbankpagina, 'collection' alleen voor de kennisbank-hub."
      - { label: "Navigatielabel", name: navLabel, widget: string }
      - { label: "Titel (H1)", name: title, widget: string }
      - { label: "Meta title (max 60 tekens)", name: metaTitle, widget: string, pattern: ["^.{1,60}$", "Max 60 tekens"] }
      - { label: "Meta description (120-160 tekens)", name: metaDescription, widget: text, pattern: ["^.{120,160}$", "120-160 tekens"] }
      - { label: Keyphrase, name: keyphrase, widget: string, required: false }
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Lede, name: lede, widget: text }
      - name: primaryCta
        label: "Primaire CTA"
        widget: object
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Href, name: href, widget: string }
      - name: secondaryCta
        label: "Secundaire CTA"
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Href, name: href, widget: string }
      - name: summary
        label: Summary
        widget: list
        required: false
        max: 4
        field: { label: Punt, name: item, widget: string }
      - { label: Published, name: published, widget: string }
      - { label: Updated, name: updated, widget: string }
      - { label: "FAQ titel", name: faqTitle, widget: string, required: false }
      - name: faq
        label: FAQ
        widget: list
        required: false
        fields:
          - { label: Vraag, name: q, widget: string }
          - { label: Antwoord, name: a, widget: text }
      - { label: Noindex, name: noindex, widget: boolean, required: false }
      - name: sources
        label: Bronnen
        widget: list
        required: false
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: URL, name: url, widget: string }
      - label: "Inhoud (body)"
        name: body
        widget: text
        hint: >-
          Gewoon tekstveld, geen markdown-editor, zodat de opmaak niet verandert.
          Laat {{price:...}}, {{pricelc:...}}, {{timing:...}} en {{title:...}} altijd
          ongewijzigd staan: deze tokens worden bij het bouwen automatisch vervangen
          door de actuele prijzen en doorlooptijden. Verwijderen of aanpassen breekt de publicatie.

