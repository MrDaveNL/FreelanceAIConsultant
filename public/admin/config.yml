# Sveltia CMS configuratie voor freelanceaiconsultant.com.
#
# Scope: markdown-content onder src/content/pages/{en,nl} én, sinds de CMS-migratie van de
# inzichten (planning/migratieplan-inzichten-cms.md), onder src/content/articles/{en,nl}. Geen
# dienstenpagina's, cases, RAG-blokken, data-bestanden, routes, componenten, layouts of
# schema/JSON-LD. Zie docs/cms.md voor de redenen; voor home/over/werkwijze (geen markdown, maar
# hardcoded .astro-pagina's + src/data/*.js) zie docs/cms.md en
# planning/migratieplan-kernpaginas-cms.md.
#
# LET OP bij de inzichten-collecties (inzichten_en/inzichten_nl, helemaal onderin dit bestand):
# zolang de CMS-migratie en de lopende blogreeks (NL+EN-parity, BLOG-01 t/m 12) niet allebei zijn
# afgerond, gaan inhoudelijke wijzigingen aan bestaande of nieuwe artikelen via de dinsdagroutine
# (planning/werkafspraak-publicatiedagen.md), NIET via dit scherm. Zie docs/cms.md.
#
# Geen Sveltia-i18n (geen top-level "i18n:"-blok): EN en NL zijn losse collecties per taal. De
# "id"-waarde in de front matter koppelt een EN- en NL-pagina inhoudelijk, maar is voor het CMS
# puur informatief, Sveltia schrijft er niets in terug. Reden: de url/mapnaam per taal is niet
# hetzelfde (bijv. "ai-examples" vs "ai-voorbeelden"), terwijl Sveltia's i18n-structuren
# (multiple_files/multiple_folders) een identieke slug per taal verwachten.
#
# Twee soorten collecties:
# - kennisbank_en/kennisbank_nl: create en delete staan AAN. Een nieuwe of verwijderde pagina
#   werkt zonder handwerk in routes.ts: src/data/routes.ts leidt de kennisbank-routes (sitemap,
#   hreflang, taalwisselaar) automatisch af uit de front matter van deze bestanden, en de build
#   faalt met een duidelijke melding (src/pages/[...slug].astro) als een contentpagina toch geen
#   'live' route heeft. 'identifier_field: navLabel' zorgt dat de mapnaam van een nieuwe pagina
#   op het korte navigatielabel wordt gebaseerd, niet op de lange titel.
#   Het 'url'-veld is hier BEWUST verborgen (widget: hidden): de gebruiker typt het nooit meer
#   zelf, cms-publish.ps1 leidt de echte url na de merge automatisch af uit de mapnaam (zie
#   scripts/fix-kennisbank-urls.mjs). Daarnaast zijn 'parent' en de CTA-href's hier een 'select'
#   in plaats van vrije tekst, zodat een nieuwe kennisbankpagina niet kan verwijzen naar een
#   niet-bestaand id of pad. src/data/routes.ts / content.config.ts blijven deze waarden ook bij
#   het bouwen controleren (vangnet voor handmatig aangemaakte bestanden, buiten dit CMS om).
# - overige_pagina_en/overige_pagina_nl: alle andere markdown-pagina's onder src/content/pages
#   (de 12 clusters, elk een hoofdpagina + eventuele subpagina's), als "files"-collecties: een
#   vaste lijst van bestaande bestanden, zodat er hier GEEN create/delete-knop kan verschijnen.
#   Nieuwe pagina's in deze clusters (nieuw id, interne links, RAG-afstemming) blijven via
#   Claude Code lopen, met de volledige verificatie. 'url' en 'parent' blijven hier vrije tekst
#   (geen create, dus minder risico op een nieuw, verkeerd pad); de CTA-href krijgt wel dezelfde
#   'select' als de kennisbank, voor hetzelfde gemak en om typefouten te voorkomen.
#
# De twee varianten delen zoveel mogelijk velden, maar YAML kent geen manier om een deel van een
# anchor-lijst te overschrijven (het merge-sleutel '<<' werkt alleen voor mappings, niet voor
# lijsten). Daarom staan 'kennisbankFields{En,Nl}' en 'overigeFields{En,Nl}' hieronder voluit,
# elk met hun eigen 'url'/'parent'/CTA-href-veld, in lijn met hoe dit bestand EN/NL al dubbel
# uitschrijft (zie hierboven).

backend:
  name: github
  repo: MrDaveNL/FreelanceAIConsultant
  branch: cms

# Niet gebruikt: geen afbeelding staat in content-bestanden (zie fase 1, punt 7). Verplicht veld
# voor Sveltia, vandaar een map die in de praktijk leeg blijft.
media_folder: "public/admin/uploads"
public_folder: "/admin/uploads"

collections:
  - name: kennisbank_en
    label: "Knowledge base (EN)"
    folder: src/content/pages/en/kennisbank
    path: "{{slug}}/index"
    identifier_field: navLabel
    format: frontmatter
    extension: md
    create: true
    delete: true
    fields: &kennisbankFieldsEn
      - label: "ID"
        name: id
        widget: string
        pattern: ["^[A-Za-z0-9-]+$", "Alleen letters, cijfers en -"]
        hint: >-
          Koppelt de EN- en NL-versie van deze pagina; moet uniek zijn op de hele site.
          Voorbeeld: C10-06, of een nieuw P-nummer voor een hoofdpagina. Controleer de IDs van de
          andere pagina's in deze lijst (en de NL-lijst) voordat je kiest, om een dubbele ID te
          voorkomen.
      - { label: Taal, name: lang, widget: hidden, default: en }
      - label: URL
        name: url
        widget: hidden
        default: ""
        required: false
        hint: >-
          Wordt automatisch afgeleid uit de mapnaam (dus uit het Navigatielabel hieronder) zodra
          deze pagina wordt gepubliceerd. Hoeft hier niet ingevuld te worden.
      - label: "Parent ID"
        name: parent
        widget: select
        required: false
        options:
          - { label: "P08 — Knowledge base (hub)", value: "P08" }
          - { label: "C1-07 — What does an AI consultant do?", value: "C1-07" }
          - { label: "C3-06 — AI examples", value: "C3-06" }
          - { label: "C3-08 — RPA versus AI", value: "C3-08" }
          - { label: "C4-05 — What does a BI specialist do?", value: "C4-05" }
          - { label: "C5-04 — What does an AI developer do?", value: "C5-04" }
          - { label: "C6-05 — AI agents and GDPR", value: "C6-05" }
          - { label: "C10-01 — ChatGPT for business", value: "C10-01" }
          - { label: "C10-02 — Claude for business", value: "C10-02" }
          - { label: "C10-03 — Gemini for business", value: "C10-03" }
          - { label: "C10-04 — Copilot for business", value: "C10-04" }
          - { label: "C10-05 — Prompt engineering", value: "C10-05" }
        hint: >-
          ID van de bovenliggende kennisbankpagina, of de hub (P08). Leeg laten voor een
          hoofdpagina. Staat de juiste pagina er niet bij (een nieuwe pagina uit deze lijst,
          of een pagina buiten de kennisbank), vraag dan Claude Code dit veld na publicatie
          handmatig te zetten.
      - label: Cluster
        name: cluster
        widget: select
        options:
          - "1. AI Consulting & Advice"
          - "2. AI Implementation"
          - "3. AI Automation"
          - "4. AI for business"
          - "5. AI Development"
          - "6. AI Agents"
          - "7. AI markets"
          - "8. AI policy & governance"
          - "9. AI workshops & training"
          - "10. Knowledge base AI tools"
          - "Core pages"
        default: "10. Knowledge base AI tools"
        hint: >-
          Welke sectie van de site. Voorbeeld: voor een nieuwe kennisbankpagina meestal
          '10. Knowledge base AI tools' (de standaardwaarde). Moet overeenkomen met het cluster
          van de NL-tegenhanger (zelfde ID): cms-publish.ps1 waarschuwt anders.
      - label: "Page type"
        name: pageType
        widget: select
        options: [Hub, Spoke, Sector, "Knowledge base", "Knowledge base hub", "Conversion / pricing", "Trust / partner network"]
        default: "Knowledge base"
        hint: "Voorbeeld: 'Knowledge base' voor een gewone kennisbankpagina (de standaardwaarde)."
      - label: Schema
        name: schema
        widget: select
        options: [service, article, collection, pricing]
        default: article
        hint: "Voorbeeld: 'article' voor een gewone kennisbankpagina (de standaardwaarde). 'collection' is alleen voor de kennisbank-hub."
      - label: "Navigatielabel"
        name: navLabel
        widget: string
        hint: >-
          Kort label voor het menu en de kruimelpaden. Bepaalt ook de mapnaam en dus de url van
          deze pagina (bijv. "AI voorbeelden" wordt de map/url "ai-voorbeelden"). Voorbeeld:
          "AI voorbeelden".
      - label: "Titel (H1)"
        name: title
        widget: string
        hint: >-
          De zichtbare hoofdtitel van de pagina. Voorbeeld: "AI voorbeelden: 25 toepassingen uit
          de praktijk".
      - label: "Meta title (max 60 tekens)"
        name: metaTitle
        widget: string
        pattern: ["^.{1,60}$", "Max 60 tekens"]
        hint: >-
          Titel die in Google getoond wordt (max 60 tekens). Voorbeeld: "AI voorbeelden | 25
          praktische toepassingen voor bedrijven".
      - label: "Meta description (120-160 tekens)"
        name: metaDescription
        widget: text
        pattern: ["^.{120,160}$", "120-160 tekens"]
        hint: >-
          Omschrijving onder de titel in Google (120-160 tekens). Voorbeeld: "Bekijk 25 concrete
          AI voorbeelden uit de praktijk, per afdeling en sector. Ontdek welke toepassingen direct
          waarde opleveren en hoe bedrijven ermee beginnen."
      - label: Keyphrase
        name: keyphrase
        widget: string
        required: false
        hint: >-
          Primaire zoekterm van deze pagina. Voorbeeld: "ai voorbeelden". Leeg laten bij een
          navigatie-/hubpagina zonder duidelijke eigen keyphrase.
      - label: Eyebrow
        name: eyebrow
        widget: string
        hint: "Klein label boven de titel. Voorbeeld: \"Knowledge base\"."
      - label: Lede
        name: lede
        widget: text
        hint: >-
          Openingsalinea direct onder de titel (1-3 zinnen). Voorbeeld: "Anyone looking for AI
          examples mostly finds big promises. This list does the opposite: ..."
      - name: primaryCta
        label: "Primaire CTA"
        widget: object
        fields:
          - { label: Label, name: label, widget: string, hint: "Tekst op de knop. Voorbeeld: \"See the AI Readiness Assessment\"." }
          - &ctaHrefEn
            label: Href
            name: href
            widget: select
            options:
              - { label: "Contact", value: "/contact" }
              - { label: "AI Readiness Assessment", value: "/services/ai-readiness-assessment" }
              - { label: "AI Strategy Sprint", value: "/services/ai-strategy-sprint" }
              - { label: "Fractional AI Lead", value: "/services/fractional-ai-lead" }
              - { label: "Vendor Review", value: "/services/vendor-review" }
              - { label: "Executive Briefing", value: "/services/executive-briefing" }
              - { label: "AI Due Diligence", value: "/services/ai-due-diligence" }
              - { label: "Services (overview)", value: "/services" }
              - { label: "Pricing", value: "/pricing" }
              - { label: "Knowledge base (hub)", value: "/knowledge-base" }
              - { label: "AI Consulting", value: "/ai-consulting" }
              - { label: "AI Implementation", value: "/ai-implementation" }
              - { label: "AI Automation", value: "/ai-automation" }
              - { label: "AI for Business", value: "/ai-for-business" }
              - { label: "AI Development", value: "/ai-development" }
              - { label: "AI Agents", value: "/ai-agents" }
              - { label: "AI Policy", value: "/ai-policy" }
              - { label: "AI Workshop", value: "/ai-workshop" }
              - { label: "Markets", value: "/markets" }
              - { label: "Partner network", value: "/partner-network" }
            hint: >-
              Alleen de belangrijkste dienst-, cluster- en contactpagina's staan in deze lijst.
              Moet een bestaande, live pagina zijn; de build faalt anders. Staat het gewenste pad
              er niet bij, vraag Claude Code het na publicatie handmatig te zetten.
      - name: secondaryCta
        label: "Secundaire CTA"
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string, hint: "Tekst op de knop. Voorbeeld: \"Book a strategy call\"." }
          - *ctaHrefEn
      - name: summary
        label: Summary
        widget: list
        required: false
        max: 4
        field: { label: Punt, name: item, widget: string, hint: "Korte bullet. Voorbeeld: \"Most useful AI applications are small: read, sort, summarize, draft.\"" }
      - label: Published
        name: published
        widget: string
        hint: "Publicatiedatum, formaat JJJJ-MM-DD. Voorbeeld: \"2026-09-23\"."
      - label: Updated
        name: updated
        widget: string
        hint: "Datum van de laatste inhoudelijke wijziging, formaat JJJJ-MM-DD. Voorbeeld: \"2026-09-23\"."
      - label: "FAQ titel"
        name: faqTitle
        widget: string
        required: false
        hint: "Titel boven de FAQ-sectie. Voorbeeld: \"Frequently asked questions\"."
      - name: faq
        label: FAQ
        widget: list
        required: false
        fields:
          - { label: Vraag, name: q, widget: string, hint: "Voorbeeld: \"Is ChatGPT safe to use for business data?\"" }
          - { label: Antwoord, name: a, widget: text, hint: "Kort, concreet antwoord op de vraag hiernaast." }
      - label: Noindex
        name: noindex
        widget: boolean
        required: false
        hint: >-
          Aanzetten als deze pagina nog NIET gepubliceerd mag worden: wordt wel gebouwd, maar
          krijgt 'noindex, follow' en blijft uit de sitemap.
      - name: sources
        label: Bronnen
        widget: list
        required: false
        fields:
          - { label: Titel, name: title, widget: string, hint: "Naam van de bron. Voorbeeld: \"Google DeepMind: Traffic prediction with advanced Graph Neural Networks\"." }
          - { label: URL, name: url, widget: string, hint: "Volledige https-link naar de bron." }
      - label: "Inhoud (body)"
        name: body
        widget: text
        hint: >-
          Gewoon tekstveld, geen markdown-editor, zodat de opmaak niet verandert.
          Laat {{price:...}}, {{pricelc:...}}, {{timing:...}} en {{title:...}} altijd
          ongewijzigd staan: deze tokens worden bij het bouwen automatisch vervangen
          door de actuele prijzen en doorlooptijden. Verwijderen of aanpassen breekt de publicatie.

