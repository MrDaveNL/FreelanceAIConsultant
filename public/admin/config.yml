      - { label: URL, name: url, widget: string, pattern: ["^/", "Moet beginnen met /"] }
      - { label: "Parent ID", name: parent, widget: string, required: false }
      - { label: Cluster, name: cluster, widget: string }
      - { label: "Page type", name: pageType, widget: string }
      - { label: Schema, name: schema, widget: select, options: [service, article, collection, pricing] }
      - { label: "Navigatielabel", name: navLabel, widget: string }
      - { label: "Titel (H1)", name: title, widget: string }
      - { label: "Meta title (max 60 tekens)", name: metaTitle, widget: string, pattern: ["^.{1,60}$", "Max 60 tekens"] }
      - { label: "Meta description (120-160 tekens)", name: metaDescription, widget: text, pattern: ["^.{120,160}$", "120-160 tekens"] }
      - { label: Keyphrase, name: keyphrase, widget: string, required: false }
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Lede, name: lede, widget: text }
      - name: primaryCta
        label: "Primaire CTA"
        widget: object
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Href, name: href, widget: string }
      - name: secondaryCta
