  # de CMS-migratie en de lopende blogreeks (NL+EN-parity, BLOG-01 t/m 12) nog niet allebei
  # volledig zijn afgerond, gaan inhoudelijke wijzigingen aan deze artikelen via de
  # dinsdagroutine (handmatige branch + extractiescript + dist-diff, zie
  # planning/werkafspraak-publicatiedagen.md), NIET via dit CMS-scherm — zie docs/cms.md.
  # Het veldschema wijkt af van de kennisbank/overige-collecties hierboven (geen url/parent/
  # cluster/pageType/schema/navLabel/primaryCta: dat zijn velden van de 'pages'-collectie, de
  # 'articles'-collectie heeft een eigen schema, zie content.config.ts).
  - name: inzichten_en
    label: "Insights (EN)"
    folder: src/content/articles/en
    path: "{{slug}}/index"
    identifier_field: slug
    format: frontmatter
    extension: md
    create: true
    delete: true
    fields: &inzichtenFieldsEn
      - label: "ID"
        name: id
        widget: string
        pattern: ["^[A-Za-z0-9-]+$", "Alleen letters, cijfers en -"]
        hint: >-
          Koppelt de EN- en NL-versie van dit artikel (geen technische eis, puur informatief).
          Voorbeeld: "en-why-ai-pilots-stall". Hoeft niet uniek te zijn over de hele site, alleen
          herkenbaar.
      - { label: Taal, name: lang, widget: hidden, default: en }
      - label: Slug
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Alleen kleine letters, cijfers en -"]
        hint: >-
          Bepaalt de mapnaam en dus de URL (/insights/<slug>). Voorbeeld:
          "why-ai-pilots-stall". Na het aanmaken niet meer wijzigen: dat verplaatst het bestand
          niet en breekt de link met bestaande interne verwijzingen.
      - label: Counterpart
        name: counterpart
        widget: string
        required: false
        hint: >-
          Slug van de NL-vertaling van dit artikel, als die bestaat (leeg = nog geen vertaling).
          Technische koppeling (anders dan "ID" hierboven): src/data/routes.ts leidt hieruit de
          sitemap/hreflang/taalwisselaar-route van dit artikel af. Voorbeeld:
          "waarom-ai-pilots-blijven-steken".
      - label: Category
        name: category
        widget: string
        hint: >-
          Voorbeeld: "Strategy", "Organisation", "Use cases", "Tools & data", "Governance"
          (bestaande categorieën; een nieuwe mag, verschijnt dan als nieuw filter op de hub).
      - label: Tone
        name: tone
        widget: select
        options: [aqua, sand, salmon, yellow]
        hint: "Kleur van het kaartje op de inzichten-hub."
      - label: Icon
        name: icon
        widget: string
        hint: "Eén teken/symbool voor het kaartje. Voorbeeld: ◷, ⚖, ◐."
      - label: Featured
        name: featured
        widget: boolean
        default: false
        hint: "Maximaal één artikel per taal mag 'true' zijn; dat verschijnt uitgelicht op de hub."
      - label: Title
        name: title
        widget: string
        hint: "Volledige titel, gebruikt in <title>, JSON-LD en kaartjes."
      - label: "Title (line 1)"
        name: titleLine1
        widget: string
        hint: "Eerste regel van de H1 op de artikelpagina (titel loopt over twee regels)."
      - label: "Title (line 2, marked)"
        name: titleLine2
        widget: string
        hint: "Tweede regel van de H1, met een markeeraccent."
      - label: Excerpt
        name: excerpt
        widget: text
        hint: "Korte samenvatting op kaartjes en in de RSS-feed/meta description-fallback."
      - label: "Meta title"
        name: metaTitle
        widget: string
        required: false
        hint: "Optioneel; valt terug op Title als dit leeg is."
      - label: "Meta description"
        name: metaDescription
        widget: text
        required: false
        hint: "Optioneel; valt terug op Excerpt als dit leeg is."
      - label: Lede
        name: lede
        widget: text
        hint: "Openingsalinea direct onder de titel."
      - label: "Reading time"
        name: readingTime
        widget: string
        hint: "Voorbeeld: \"6 min read\"."
      - label: "Published date"
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}-\\d{2}$", "Formaat JJJJ-MM-DD"]
        hint: "Publicatiedatum, formaat JJJJ-MM-DD. Bepaalt de sortering op de hub en in de RSS-feed."
      - label: "Published date (label)"
        name: dateLabel
        widget: string
        hint: "Zichtbare datum. Voorbeeld: \"November 6, 2026\"."
      - label: Updated
        name: updated
        widget: string
        required: false
        hint: "Datum van de laatste inhoudelijke wijziging, formaat JJJJ-MM-DD. Leeg = geen wijziging sinds publicatie."
      - label: Order
        name: order
        widget: number
        required: false
        value_type: int
        hint: >-
          Tiebreak bij een gelijke 'Published date' met een ander artikel (lager = nieuwer/boven
          op de hub en in de RSS-feed). Alleen nodig bij een exacte datumbotsing; anders leeg laten.
      - name: summary
        label: Summary
        widget: list
        field: { label: Punt, name: item, widget: string }
        hint: "Korte bullets in het 'AT A GLANCE'-kaartje."
      - label: "Summary (closing line)"
        name: summaryClose
        widget: string
        hint: "Afsluitende regel onder de summary-bullets."
      - name: takeaways
        label: "Key takeaways"
        widget: list
        hint: "Elk item precies twee regels: een korte titel en de toelichting."
        field:
          label: Takeaway
          name: pair
          widget: list
          min: 2
          max: 2
          field: { label: Regel, name: line, widget: string }
      - label: Remember
        name: remember
        widget: string
        hint: "Citaat-achtige afsluitregel in het zijpaneel."
      - name: related
        label: "Related articles"
        widget: list
        required: false
        field: { label: Slug, name: slug, widget: string, hint: "Slug van een ander EN-artikel, bijv. \"why-ai-pilots-stall\"." }
      - name: faq
        label: FAQ
        widget: list
        required: false
        fields:
          - { label: Question, name: q, widget: string }
          - { label: Answer, name: a, widget: text }
      - label: "Content (body)"
        name: body
        widget: text
        hint: >-
          Gewoon tekstveld, geen markdown-editor, zodat de opmaak niet verandert. Dit veld bevat
          de kant-en-klare HTML van het artikel; wijzig de structuur (koppen, links) alleen met
          zorg, zie de werkafspraak in docs/cms.md en planning/werkafspraak-publicatiedagen.md.

